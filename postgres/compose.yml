services:
  db:
    image: postgres:${TAG:-latest}
    ports:
    - "${PORT:-5432}:5432"
    volumes:
    - data:/var/lib/postgresql
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-postgres}
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?password required}

volumes:
  data:
